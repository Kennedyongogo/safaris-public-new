upstream api {
  server api:4000;
}

# Map to detect social media crawlers
map $http_user_agent $is_crawler {
  default 0;
  ~*facebookexternalhit 1;
  ~*LinkedInBot 1;
  ~*Twitterbot 1;
  ~*WhatsApp 1;
  ~*Slackbot 1;
  ~*SkypeUriPreview 1;
  ~*Applebot 1;
  ~*Googlebot 1;
  ~*Bingbot 1;
}

server {
  listen 80;
  client_max_body_size 0;
  resolver 127.0.0.11;

  # API proxy (must be before static files)
  location /api {
    set $docker_host "api";
    proxy_pass http://$docker_host:4000;
  }

  # Proxy uploads (served statically by the API) - must be before static file rules
  location ^~ /uploads/ {
    set $docker_host "api";
    proxy_pass http://$docker_host:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Detect social media crawlers and serve pre-rendered HTML for blog posts
  location ~ ^/blog/(.+)$ {
    set $slug $1;
    set $docker_host "api";
    
    # If crawler, proxy to API endpoint that serves HTML with meta tags
    if ($is_crawler = 1) {
      proxy_pass http://$docker_host:4000/api/blogs/html/$slug;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      break;
    }
    
    # If not crawler, serve normal React app
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }

  # No cache for index.html (must always fetch fresh)
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;
  }

  # Long-term cache for static assets (with Vite's hashed filenames)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|json|wasm)$ {
    root /usr/share/nginx/html;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # React / Vite frontend (must be last as catch-all)
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
